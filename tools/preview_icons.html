<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    background: #080808;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
    margin: 0;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #F1F5F9; }
  p { color: #94A3B8; font-size: 13px; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    max-width: 900px;
  }
  .card {
    background: #181819;
    border: 1px solid #292829;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card-title {
    font-size: 13px;
    font-weight: 500;
    color: #94A3B8;
    margin-bottom: 12px;
  }
  .scale-row {
    display: flex;
    align-items: center;
    justify-content: space-around;
    width: 100%;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #292829;
  }
  .scale-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .scale-label {
    font-size: 10px;
    color: #64748B;
  }
</style>
</head>
<body>
<h1>High Quality Weather Icon Set &mdash; Depth & Gradient</h1>
<p>Preview across all dashboard scales: Hero (k=2.0), Hourly (k=1.5), Status (k=1.2), Daily (k=1.0)</p>

<div class="grid" id="grid"></div>

<script>
// --- COLOR TOKENS ---
const SUN_CORE = '#FFE853';
const SUN_MID  = '#FFB703';
const SUN_EDGE = '#FB8500';
const SUN_RAY  = '#FFB000';
const SUN_GLOW = 'rgba(255, 255, 255, 0.45)';

const CLOUD_LIGHT_TOP = '#FFFFFF';
const CLOUD_LIGHT_MID = '#E2E8F0';
const CLOUD_LIGHT_BOT = '#94A3B8';

const CLOUD_BACK_TOP  = '#94A3B8';
const CLOUD_BACK_BOT  = '#64748B';

const CLOUD_RAIN_TOP  = '#94A3B8';
const CLOUD_RAIN_BOT  = '#475569';

const CLOUD_STORM_TOP = '#64748B';
const CLOUD_STORM_BOT = '#1E293B';

const RAIN_TOP = '#38BDF8';
const RAIN_BOT = '#1D4ED8';

const BOLT_CORE = '#FFFBEB';
const BOLT_MID  = '#FACC15';
const BOLT_TIP  = '#F59E0B';

const SNOW_WHITE = '#FFFFFF';
const SNOW_ICE   = '#BAE6FD';

const FOG_1 = '#CBD5E1';
const FOG_2 = '#94A3B8';
const FOG_3 = '#64748B';

// --- DRAWING ENGINE ---
function drawSunDisc(ctx, cx, cy, r) {
  const g = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.25, r * 0.1, cx, cy, r);
  g.addColorStop(0, SUN_CORE);
  g.addColorStop(0.5, SUN_MID);
  g.addColorStop(1, SUN_EDGE);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Subtle specular reflection
  if (r >= 4) {
    ctx.fillStyle = SUN_GLOW;
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawSunRays(ctx, cx, cy, rIn, rOut, lw) {
  ctx.strokeStyle = SUN_RAY;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4;
    const isDiag = i % 2 === 1;
    const rO = isDiag ? rOut * 0.94 : rOut;
    const rI = isDiag ? rIn * 1.02 : rIn;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * rI, cy + Math.sin(a) * rI);
    ctx.lineTo(cx + Math.cos(a) * rO, cy + Math.sin(a) * rO);
    ctx.stroke();
  }
}

function drawCloudPath(ctx, cx, cy, k, puffScale = 1.0) {
  const S = (v) => v * k;
  const p = puffScale;
  ctx.beginPath();
  // Left puff
  ctx.arc(cx - S(4.5), cy + S(0.8), S(3.6) * p, 0, Math.PI * 2);
  // Center-top puff
  ctx.arc(cx - S(0.8), cy - S(2.0), S(5.2) * p, 0, Math.PI * 2);
  // Right puff
  ctx.arc(cx + S(3.5), cy + S(0.8), S(3.4) * p, 0, Math.PI * 2);
  // Base rounded rect
  const bw = S(14.5), bh = S(5.5), br = S(2.7);
  ctx.roundRect(cx - bw / 2, cy + S(1.8) - bh / 2, bw, bh, br);
}

function drawCloud(ctx, cx, cy, k, cTop, cMid, cBot, withHighlight = true) {
  const S = (v) => v * k;
  const yTop = cy - S(7.2);
  const yBot = cy + S(4.5);
  const grad = ctx.createLinearGradient(0, yTop, 0, yBot);
  grad.addColorStop(0, cTop);
  grad.addColorStop(0.45, cMid);
  grad.addColorStop(1, cBot);

  drawCloudPath(ctx, cx, cy, k);
  ctx.fillStyle = grad;
  ctx.fill();

  // Subtle top rim highlight
  if (withHighlight && k >= 1.2) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.lineWidth = Math.max(1, 0.9 * k);
    ctx.beginPath();
    ctx.arc(cx - S(0.8), cy - S(2.0), S(5.2) - ctx.lineWidth / 2, Math.PI * 1.05, Math.PI * 1.85);
    ctx.stroke();
    ctx.restore();
  }
}

function drawWeatherIcon(ctx, cx, cy, code, k) {
  const S = (v) => Math.round(v * k);
  const lw = Math.max(1.2, 1.3 * k);

  if (code === 0) {
    // 0: CLEAR SKY (SUNNY)
    const r = S(4.5);
    drawSunDisc(ctx, cx, cy, r);
    drawSunRays(ctx, cx, cy, r + S(2.2), r + S(5.2), lw);
    return;
  }

  if (code === 1 || code === 2) {
    // 1, 2: PARTLY CLOUDY (SUN + CLOUD)
    // Sun at top right
    const sx = cx + S(3.8);
    const sy = cy - S(3.8);
    const sr = S(4.2);

    // Sun rays pointing outward (not covered by cloud)
    ctx.strokeStyle = SUN_RAY;
    ctx.lineWidth = Math.max(1.1, 1.2 * k);
    ctx.lineCap = 'round';
    const angles = [-Math.PI * 0.7, -Math.PI * 0.45, -Math.PI * 0.2, 0.0, Math.PI * 0.2];
    for (const a of angles) {
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(a) * (sr + S(1.8)), sy + Math.sin(a) * (sr + S(1.8)));
      ctx.lineTo(sx + Math.cos(a) * (sr + S(4.4)), sy + Math.sin(a) * (sr + S(4.4)));
      ctx.stroke();
    }
    drawSunDisc(ctx, sx, sy, sr);

    // Subtle dark separator rim behind the cloud
    ctx.save();
    drawCloudPath(ctx, cx - S(1.5), cy + S(1.5), k, 1.08);
    ctx.fillStyle = 'rgba(24, 24, 25, 0.7)';
    ctx.fill();
    ctx.restore();

    // Foreground volumetric cloud
    drawCloud(ctx, cx - S(1.5), cy + S(1.5), k, CLOUD_LIGHT_TOP, CLOUD_LIGHT_MID, CLOUD_LIGHT_BOT, true);
    return;
  }

  if (code === 3) {
    // 3: OVERCAST / CLOUDY
    // Back cloud puff (darker slate)
    const bx = cx + S(3.2), by = cy - S(2.5);
    const bGrad = ctx.createLinearGradient(0, by - S(5), 0, by + S(3));
    bGrad.addColorStop(0, CLOUD_BACK_TOP);
    bGrad.addColorStop(1, CLOUD_BACK_BOT);
    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.arc(bx, by, S(4.6), 0, Math.PI * 2);
    ctx.arc(bx + S(2.5), by + S(2.0), S(3.2), 0, Math.PI * 2);
    ctx.fill();

    // Front cloud (crisp white -> silver -> slate)
    drawCloud(ctx, cx - S(1.2), cy + S(1.0), k, CLOUD_LIGHT_TOP, CLOUD_LIGHT_MID, CLOUD_BACK_BOT, true);
    return;
  }

  if (code === 45 || code === 48) {
    // 45, 48: FOG / MIST
    // Floating upper cloud
    drawCloud(ctx, cx, cy - S(3.0), k * 0.88, CLOUD_LIGHT_TOP, CLOUD_LIGHT_MID, CLOUD_LIGHT_BOT, false);

    // 3 horizontal mist bars with gradient depth
    const bar = (y, w, h, col) => {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.roundRect(cx - w / 2, y - h / 2, w, h, h / 2);
      ctx.fill();
    };
    const bh = Math.max(1.4, 1.7 * k);
    bar(cy + S(3.2), S(15.0), bh, FOG_1);
    bar(cy + S(5.8), S(12.0), bh, FOG_2);
    bar(cy + S(8.2), S(8.0),  Math.max(1.2, 1.4 * k), FOG_3);
    return;
  }

  if (code >= 51 && code <= 57) {
    // 51..57: DRIZZLE / LIGHT RAIN
    // Cool rain cloud
    drawCloud(ctx, cx, cy - S(2.6), k, CLOUD_LIGHT_TOP, CLOUD_RAIN_TOP, CLOUD_RAIN_BOT, false);

    // 3 gentle angled raindrops (68 degrees)
    const drop = (dx, dy) => {
      const x = cx + dx, y = cy + dy;
      const r = Math.max(1.1, 1.2 * k);
      const len = Math.max(2.5, 3.2 * k);
      const angle = Math.PI * 0.38; // ~68 deg
      const gx = Math.cos(angle), gy = Math.sin(angle);
      const grad = ctx.createLinearGradient(x - gx * len * 0.5, y - gy * len * 0.5, x + gx * len * 0.5, y + gy * len * 0.5);
      grad.addColorStop(0, RAIN_TOP);
      grad.addColorStop(1, RAIN_BOT);

      ctx.strokeStyle = grad;
      ctx.lineWidth = r * 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - gx * len * 0.5, y - gy * len * 0.5);
      ctx.lineTo(x + gx * len * 0.5, y + gy * len * 0.5);
      ctx.stroke();
    };
    drop(-S(4.5), S(4.0));
    drop(-S(0.5), S(5.5));
    drop(S(3.5), S(4.0));
    return;
  }

  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) {
    // 61..67, 80..82: RAIN / SHOWERS / HEAVY RAIN
    // Atmospheric stormy rain cloud
    drawCloud(ctx, cx, cy - S(2.6), k, CLOUD_RAIN_TOP, CLOUD_RAIN_BOT, CLOUD_STORM_BOT, false);

    // 3 dynamic rain streaks (65 degrees)
    const streak = (x0, y0, len) => {
      const angle = Math.PI * 0.36; // 65 deg
      const x1 = x0 + Math.cos(angle) * len;
      const y1 = y0 + Math.sin(angle) * len;
      const grad = ctx.createLinearGradient(x0, y0, x1, y1);
      grad.addColorStop(0, RAIN_TOP);
      grad.addColorStop(1, RAIN_BOT);

      ctx.strokeStyle = grad;
      ctx.lineWidth = Math.max(1.6, 1.8 * k);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    };
    const slen = S(6.0);
    streak(cx - S(4.2), cy + S(3.0), slen);
    streak(cx - S(0.2), cy + S(4.2), slen);
    streak(cx + S(3.8), cy + S(3.0), slen);
    return;
  }

  if (code >= 71 && code <= 77 || code === 85 || code === 86) {
    // 71..77, 85, 86: SNOW / FLURRIES
    drawCloud(ctx, cx, cy - S(2.6), k, CLOUD_LIGHT_TOP, CLOUD_LIGHT_MID, CLOUD_BACK_BOT, false);

    // Center crystalline snowflake
    const sfx = cx, sfy = cy + S(5.0);
    const slw = Math.max(1.1, 1.1 * k);
    const r = S(3.5);

    ctx.strokeStyle = SNOW_WHITE;
    ctx.lineWidth = slw;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = (i * Math.PI) / 3;
      ctx.beginPath();
      ctx.moveTo(sfx - Math.cos(a) * r, sfy - Math.sin(a) * r);
      ctx.lineTo(sfx + Math.cos(a) * r, sfy + Math.sin(a) * r);
      ctx.stroke();
    }
    // Ice blue core dot
    ctx.fillStyle = SNOW_ICE;
    ctx.beginPath();
    ctx.arc(sfx, sfy, Math.max(0.8, 1.0 * k), 0, Math.PI * 2);
    ctx.fill();

    // Two floating snow flurries
    const dot = (x, y) => {
      ctx.fillStyle = SNOW_ICE;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(0.9, 1.1 * k), 0, Math.PI * 2);
      ctx.fill();
    };
    dot(cx - S(4.8), cy + S(4.2));
    dot(cx + S(4.5), cy + S(4.2));
    return;
  }

  if (code >= 95) {
    // 95+: THUNDERSTORM
    // Dark dramatic storm cloud
    drawCloud(ctx, cx, cy - S(3.2), k, CLOUD_RAIN_BOT, CLOUD_STORM_TOP, CLOUD_STORM_BOT, false);

    // Electric lightning bolt with multi-stop vertical gradient, striking boldly down
    const yTop = cy - S(1.5);
    const yBot = cy + S(9.8);
    const bGrad = ctx.createLinearGradient(0, yTop, 0, yBot);
    bGrad.addColorStop(0, '#FFFFFF');
    bGrad.addColorStop(0.2, BOLT_CORE);
    bGrad.addColorStop(0.65, BOLT_MID);
    bGrad.addColorStop(1, BOLT_TIP);

    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.moveTo(cx + S(1.5), cy - S(1.5));
    ctx.lineTo(cx + S(4.2), cy + S(2.5));
    ctx.lineTo(cx + S(0.8), cy + S(2.8));
    ctx.lineTo(cx - S(1.8), cy + S(9.6));
    ctx.lineTo(cx - S(0.2), cy + S(4.2));
    ctx.lineTo(cx - S(2.8), cy + S(3.8));
    ctx.closePath();
    ctx.fill();

    // Subtle yellow glow around bolt
    if (k >= 1.5) {
      ctx.save();
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.4)';
      ctx.lineWidth = Math.max(1, 0.8 * k);
      ctx.stroke();
      ctx.restore();
    }
    return;
  }

  // Fallback: generic fair cloud
  drawCloud(ctx, cx, cy, k, CLOUD_LIGHT_TOP, CLOUD_LIGHT_MID, CLOUD_LIGHT_BOT, true);
}

// --- RENDER GRID ---
const conditions = [
  { code: 0,  name: 'Clear / Sunny' },
  { code: 2,  name: 'Partly Cloudy' },
  { code: 3,  name: 'Overcast / Cloudy' },
  { code: 45, name: 'Fog / Mist' },
  { code: 51, name: 'Drizzle' },
  { code: 61, name: 'Rain Showers' },
  { code: 71, name: 'Snow' },
  { code: 95, name: 'Thunderstorm' },
];

const scales = [
  { k: 2.0, size: 48, label: 'Hero (2.0)' },
  { k: 1.5, size: 36, label: 'Hourly (1.5)' },
  { k: 1.2, size: 30, label: 'Status (1.2)' },
  { k: 1.0, size: 24, label: 'Daily (1.0)' },
];

const grid = document.getElementById('grid');
conditions.forEach(cond => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-title">${cond.name}</div>`;

  // Large hero detail (k = 3.2, 80x80)
  const heroCanvas = document.createElement('canvas');
  heroCanvas.width = 80;
  heroCanvas.height = 80;
  const hCtx = heroCanvas.getContext('2d');
  drawWeatherIcon(hCtx, 40, 40, cond.code, 3.2);
  card.appendChild(heroCanvas);

  const scaleRow = document.createElement('div');
  scaleRow.className = 'scale-row';

  scales.forEach(s => {
    const col = document.createElement('div');
    col.className = 'scale-col';
    const canvas = document.createElement('canvas');
    canvas.width = s.size;
    canvas.height = s.size;
    const ctx = canvas.getContext('2d');
    drawWeatherIcon(ctx, s.size / 2, s.size / 2, cond.code, s.k);

    col.appendChild(canvas);
    const lbl = document.createElement('div');
    lbl.className = 'scale-label';
    lbl.textContent = s.label.split(' ')[0];
    col.appendChild(lbl);
    scaleRow.appendChild(col);
  });

  card.appendChild(scaleRow);
  grid.appendChild(card);
});
</script>
</body>
</html>
