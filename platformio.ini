; S3 dashboard firmware for the JC3248W535EN (ESP32-S3 N16R8, 3.5" 320x480
; AXS15231B QSPI panel + capacitive touch). See esp32-s3-spec.md and CLAUDE.md.
;
; Pinned to pioarduino 51.03.07 = Arduino-ESP32 core 3.0.7 (ESP-IDF 5.1), the
; same core generation the seller's demos (and the vendored AXS15231B driver in
; lib/axs15231b) were written against. The stock `espressif32` 6.x platform
; ships core 2.0.x / IDF 4.4, whose esp_lcd has no QSPI (quad_mode) support.

[env:jc3248w535]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2
  bitbank2/AnimatedGIF@^2.2.0

upload_port = /dev/cu.usbmodem1101
upload_speed = 921600
monitor_port = /dev/cu.usbmodem1101
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
