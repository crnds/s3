# CI (roadmap O8). Three jobs on every push and pull request:
#   firmware   pio run + the size gate (tools/size_check.py: <= 75% of the app
#              slot, no growth past the committed baseline unless it moved too)
#              + `pio test -e native` (host-side unit tests, tests/native/)
#   simulator  every page and sheet, both themes, from tests/fixtures/ against
#              tests/golden/ (tools/sim_check.mjs)
#   server     the Mac server's unit tests + contract snapshot, on the Python
#              launchd runs it with (/usr/bin/python3, 3.9.x)
# The board-vs-sim compare stays local: it needs the board. The tokenizer
# corpus (O5) gets a step here when it lands.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Regenerate tests/golden on the runner and upload them as an artifact
        type: boolean
        default: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Config (src/config.h is gitignored)
        run: cp src/config.example.h src/config.h
      - name: Build
        run: pio run
      - name: Size gate
        run: python3 tools/size_check.py
      - name: Native unit tests (O4)
        run: pio test -e native

  simulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright (pinned; no package.json in this repo)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Simulator goldens
        if: ${{ !inputs.update_goldens }}
        run: node tools/sim_check.mjs
      - name: Regenerate goldens
        if: ${{ inputs.update_goldens }}
        run: node tools/sim_check.mjs --update
      - name: Upload regenerated goldens
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@v4
        with:
          name: sim-goldens
          path: tests/golden/
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-diff
          path: tests/out/

  server:
    # launchd runs the Mac server with /usr/bin/python3 (3.9.6), so test on a
    # macOS runner with that interpreter: a 3.10+ construct then fails here
    # instead of on the Mac. If the image's system Python ever stops being 3.9,
    # fall back to setup-python 3.9 (same language level, different build).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Locate Python 3.9
        id: sys
        run: |
          if /usr/bin/python3 -c 'import sys; sys.exit(0 if sys.version_info[:2] == (3, 9) else 1)'; then
            echo "PY=/usr/bin/python3" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.sys.outputs.ok != 'true'
        with:
          python-version: "3.9"
      - name: Use setup-python's interpreter
        if: steps.sys.outputs.ok != 'true'
        run: echo "PY=python3" >> "$GITHUB_ENV"
      - name: Python version
        run: $PY --version
      - name: Syntax (3.9)
        run: $PY -m py_compile server/*.py tools/note.py
      - name: Note wrap selftest
        run: $PY tools/note.py --selftest
      - name: Server unit tests
        run: $PY -m unittest discover -s tests/server -v
